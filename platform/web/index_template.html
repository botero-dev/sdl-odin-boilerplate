	<title>Cad Tool</title>
	<meta name="title" content="Cad Tool">
	<meta name="description" content="Cad Tool">

	<style>
		body { 
			margin: 0px; 
			overflow: hidden; 
			background-color: black;
		}
		canvas.game_canvas { 
			border: 0px none; 
			background-color: black;
			padding-left: 0;
			padding-right: 0;
			margin-left: auto;
			margin-right: auto;
			display: block;
		}
	</style>
</head>
<body>
	<canvas class="game_canvas" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1" onmousedown="event.target.focus()" onkeydown="event.preventDefault()"></canvas>
	<script type="text/javascript" src="odin.js"></script>
	<script>
		var odinMemoryInterface = new odin.WasmMemoryInterface();
		odinMemoryInterface.setIntSize(4);
		var odinImports = odin.setupDefaultImports(odinMemoryInterface);

		// The Module is used as configuration for emscripten.
		var Module = {
			// This is called by emscripten when it starts up.
			instantiateWasm: (imports, successCallback) => {
				const newImports = {
					...odinImports,
					...imports
				}

				return WebAssembly.instantiateStreaming(fetch("index.wasm"), newImports).then(function(output) {
					var e = output.instance.exports;
					odinMemoryInterface.setExports(e);
					odinMemoryInterface.setMemory(e.memory);
					return successCallback(output.instance);
				});
			},
			// This happens a bit after `instantiateWasm`, when everything is
			// done setting up. At that point we can run code.
			onRuntimeInitialized: () => {
				var e = wasmExports;

				// Calls any procedure marked with @init
				e._start();

				// See source/main_web/main_web.odin for main_start,
				// main_update and main_end.
				e.main_start();

				function send_resize() {
					var canvas = document.getElementById('canvas');
					canvas.width = window.innerWidth;// * devicePixelRatio;
					canvas.height = window.innerHeight;// * devicePixelRatio;
					//canvas.style.setProperty("width", window.innerWidth + "px")
					//canvas.style.setProperty("height", window.innerHeight + "px")
					canvas.style.setProperty("width",  "100%")
					canvas.style.setProperty("height", "100%")
					e.web_window_size_changed(canvas.width, canvas.height);
				}

                window.addEventListener('resize', function(event) {
        			send_resize();
				}, true);

				// This can probably be done better: Ideally we'd feed the
				// initial size to `main_start`. But there seems to be a
				// race condition. `canvas` doesn't have it's correct size yet.
				send_resize();

				// Runs the "main loop".
				function do_main_update() {
					if (!e.main_update()) {
						e.main_end();

						// Calls procedures marked with @fini
						e._end();
						return;
					}
					window.requestAnimationFrame(do_main_update);
				}

				window.requestAnimationFrame(do_main_update);

				load_delayed();

			},
			print: (function() {
				var element = document.getElementById("output");
				if (element) element.value = ''; // clear browser cache
				return function(text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
					if (element) {
					  element.value += text + "\n";
					  element.scrollTop = element.scrollHeight; // focus on bottom
					}
				};
			})(),
			canvas: (function() {
				return document.getElementById("canvas");
			})()
		};



// This function will read and process your file
async function handleCustomFile(fileHandle) {
  try {
    // Get the actual file from the handle
    const file = await fileHandle.getFile();
    
    // Check the file extension again for safety
    if (!file.name.endsWith('.dxf')) {
      console.error('Wrong file type');
      return;
    }

    // Read the file content
    const fileContent = await file.arrayBuffer();

	const data = new Uint8Array(fileContent);
	const len = data.length;

	const ptr = Module._js_alloc(len);

	const wasmMemory = new Uint8Array(odinMemoryInterface.exports.memory.buffer, ptr, len);
	wasmMemory.set(data);

	Module._load_dxf_bytes(ptr, len);

    
    // --- Integrate with your WASM module here ---
    // Example: Call your WASM function
    // wasmModule.process_file(fileContent, file.name);
    console.log(`Processing file: ${file.name}`, fileContent);
    
  } catch (error) {
    console.error('Error handling file:', error);
  }
}
async function load_delayed() {
	check_launch_queue();
	//setTimeout(check_launch_queue, 1000);
}

async function check_launch_queue() {

	// Check if the LaunchQueue API is supported
	if ('launchQueue' in window) {
	console.log('LaunchQueue is supported!');
	
	// Set the consumer for when the app is launched with a file
	launchQueue.setConsumer(async (launchParams) => {
		// The 'files' array contains the handles of opened files
		if (launchParams.files && launchParams.files.length) {
		// For now, handle only the first file
		await handleCustomFile(launchParams.files[0]);
		}
	});
	} else {
	console.log('LaunchQueue not supported. File handling will not work.');
	}
}


	</script>

	<!-- Emscripten injects its javascript here -->
